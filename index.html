<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 麥玲玲運程書 - 智能瀏覽器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdfbf7; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        canvas { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background-color: white; }

        /* 列印樣式核心邏輯 */
        @media print {
            @page { size: A4; margin: 10mm; }
            
            /* 重置高度與溢位，允許內容流動 */
            html, body, #root, .app-container {
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                overflow-y: visible !important;
            }

            /* 隱藏所有內容 */
            body * {
                visibility: hidden;
            }

            /* 只顯示報告模態框及其子元素 */
            #report-modal, #report-modal * {
                visibility: visible;
            }

            /* 將模態框定位到頁面頂部 */
            #report-modal {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                z-index: 9999 !important;
                display: block !important;
                overflow: visible !important;
            }
            
            .report-container { 
                box-shadow: none !important; 
                max-width: none !important; 
                width: 100% !important;
                position: static !important;
                height: auto !important;
                overflow: visible !important;
            }
            
            .no-print { display: none !important; }
            .print-content { padding: 0 !important; }
            
            /* --- 關鍵修復：分頁控制 --- */
            
            /* 每一個預覽項目容器 */
            .page-preview-item { 
                page-break-inside: avoid; 
                break-inside: avoid;
                display: block;
                margin-bottom: 0 !important; 
                padding-bottom: 0 !important;
                height: auto;
                /* 確保每個項目不會超過一頁 */
                max-height: 275mm; 
                overflow: hidden;
            }
            
            /* 只在項目之間分頁，最後一個項目後不分頁 */
            .page-preview-item:not(:last-child) {
                page-break-after: always;
                break-after: page;
            }

            /* 顯示標題，讓列印版更清晰 */
            .page-preview-title {
                display: flex !important;
                visibility: visible !important;
                font-size: 12pt;
                color: #333;
                border-bottom: 1px solid #ccc;
                margin-bottom: 5px;
                padding-bottom: 2px;
            }

            /* 限制 Canvas 高度，預留標題空間，防止溢出導致空白頁 */
            .page-preview-item canvas {
                width: auto !important;
                max-width: 100% !important;
                max-height: 250mm !important; /* A4高度約297mm，扣除邊距和標題 */
                display: block;
                margin: 0 auto;
                object-fit: contain;
            }
            
            section, tr, .no-overflow-check { 
                page-break-inside: avoid; 
            }
            
            .break-after-avoid { page-break-after: avoid; }
            .print-break { page-break-after: always; display: block !important; height: 1px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { createRoot } = ReactDOM;

        // --- 內置圖標組件 ---
        const ICONS = {
            'user': <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>,
            'alert-triangle': <g><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
            'book-open': <g><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g>,
            'star': <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
            'compass': <g><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></g>,
            'file-text': <g><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></g>,
            'help-circle': <g><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>,
            'search': <g><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></g>,
            'chevron-right': <polyline points="9 18 15 12 9 6"/>,
            'chevron-left': <polyline points="15 18 9 12 15 6"/>,
            'upload-cloud': <g><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></g>,
            'eye': <g><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></g>,
            'plus': <g><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></g>,
            'minus': <line x1="5" y1="12" x2="19" y2="12"/>,

            'printer': <g><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></g>,
            'x': <g><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></g>,
            'layers': <g><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></g>,
            'calendar': <g><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></g>,
            'moon': <g><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></g>,
            'sun': <g><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></g>
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const content = ICONS[name] || ICONS['alert-circle'];
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {content}
                </svg>
            );
        };

        // --- 數據設定 ---
        const ZODIAC_DATA = {
            "馬": { page: 42, monthly: 49, wealth: 44, health: 45, years: {1930:46, 1942:46, 1954:46, 1966:47, 1978:47, 1990:48, 2002:48, 2014:48} },
            "羊": { page: 52, monthly: 59, wealth: 54, health: 55, years: {1931:56, 1943:56, 1955:56, 1967:57, 1979:57, 1991:58, 2003:58, 2015:58} },
            "猴": { page: 62, monthly: 69, wealth: 64, health: 65, years: {1932:66, 1944:66, 1956:66, 1968:67, 1980:67, 1992:67, 2004:68, 2016:68} },
            "雞": { page: 72, monthly: 79, wealth: 74, health: 75, years: {1933:76, 1945:76, 1957:76, 1969:77, 1981:77, 1993:77, 2005:78, 2017:78} },
            "狗": { page: 82, monthly: 89, wealth: 84, health: 85, years: {1934:86, 1946:86, 1958:86, 1970:87, 1982:87, 1994:88, 2006:88, 2018:88} },
            "豬": { page: 92, monthly: 99, wealth: 94, health: 95, years: {1935:96, 1947:96, 1959:96, 1971:97, 1983:97, 1995:97, 2007:97, 2019:97} },
            "鼠": { page: 100, monthly: 109, wealth: 104, health: 105, years: {1936:106, 1948:106, 1960:106, 1972:107, 1984:107, 1996:108, 2008:108, 2020:108} },
            "牛": { page: 112, monthly: 119, wealth: 114, health: 115, years: {1937:116, 1949:116, 1961:116, 1973:117, 1985:117, 1997:118, 2009:118, 2021:118} },
            "虎": { page: 122, monthly: 129, wealth: 124, health: 125, years: {1938:126, 1950:126, 1962:126, 1974:127, 1986:127, 1998:128, 2010:128, 2022:128} },
            "兔": { page: 132, monthly: 139, wealth: 134, health: 135, years: {1939:136, 1951:136, 1963:136, 1975:137, 1987:137, 1999:138, 2011:138, 2023:138} },
            "龍": { page: 142, monthly: 149, wealth: 144, health: 145, years: {1940:146, 1952:146, 1964:146, 1976:147, 1988:147, 2000:148, 2012:148, 2024:148} },
            "蛇": { page: 150, monthly: 159, wealth: 154, health: 155, years: {1941:156, 1953:156, 1965:156, 1977:156, 1989:157, 2001:158, 2013:158, 2025:158} }
        };

        // 簡體到繁體生肖映射
        const ZODIAC_MAP = {
            '马': '馬', '鸡': '雞', '猪': '豬', '龙': '龍',
            '馬': '馬', '羊': '羊', '猴': '猴', '雞': '雞', '狗': '狗', '豬': '豬',
            '鼠': '鼠', '牛': '牛', '虎': '虎', '兔': '兔', '龍': '龍', '蛇': '蛇'
        };

        const FAN_TAI_SUI_RULES = {
            "馬": { type: "本命年 + 刑太歲", page: 20, desc: "運勢波動，宜貼身佩戴羊形飾物。" },
            "鼠": { type: "沖太歲", page: 20, desc: "變化最大，感情關口，宜動不宜靜。" },
            "兔": { type: "破太歲", page: 21, desc: "人際破壞，破壞固有關係，慎言。" },
            "牛": { type: "害太歲", page: 21, desc: "小人作祟，陷害之意，保持低調。" }
        };

        const GENERAL_PAGES = {
            "fengShuiChart": 10,
            "fengShuiLayout": 376,
            "accessories": 28,
            "worldTrend": 8,
            "calendar": 422
        };

        const DAY_PILLAR_START_PAGE = 254; 
        const PAGES_PER_PILLAR = 2; 

        const JIA_ZI = [
            "甲子", "乙丑", "丙寅", "丁卯", "戊辰", "己巳", "庚午", "辛未", "壬申", "癸酉",
            "甲戌", "乙亥", "丙子", "丁丑", "戊寅", "己卯", "庚辰", "辛巳", "壬午", "癸未",
            "甲申", "乙酉", "丙戌", "丁亥", "戊子", "己丑", "庚寅", "辛卯", "壬辰", "癸巳",
            "甲午", "乙未", "丙申", "丁酉", "戊戌", "己亥", "庚子", "辛丑", "壬寅", "癸卯",
            "甲辰", "乙巳", "丙午", "丁未", "戊申", "己酉", "庚戌", "辛亥", "壬子", "癸丑",
            "甲寅", "乙卯", "丙辰", "丁巳", "戊午", "己未", "庚申", "辛酉", "壬戌", "癸亥"
        ];

        // --- 單頁渲染組件 ---
        const PdfPagePreview = ({ pdfDoc, pageNum, pageOffset, scale = 2.0, title }) => {
            const canvasRef = useRef(null);
            const [status, setStatus] = useState('loading'); 

            useEffect(() => {
                if (!pdfDoc || !pageNum) return;

                let renderTask = null;
                const render = async () => {
                    try {
                        const actualPageNum = pageNum + parseInt(pageOffset);
                        if (actualPageNum < 1 || actualPageNum > pdfDoc.numPages) {
                            setStatus('error');
                            return;
                        }

                        const page = await pdfDoc.getPage(actualPageNum);
                        const canvas = canvasRef.current;
                        if (!canvas) return;

                        const viewport = page.getViewport({ scale });
                        const context = canvas.getContext('2d');

                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        
                        renderTask = page.render(renderContext);
                        await renderTask.promise;
                        setStatus('success');
                    } catch (error) {
                        console.error(`Error rendering page ${pageNum}:`, error);
                        setStatus('error');
                    }
                };

                render();

                return () => {
                    if (renderTask) renderTask.cancel();
                };
            }, [pdfDoc, pageNum, pageOffset, scale]);

            return (
                <div className="mb-4 break-inside-avoid page-preview-item">
                    {/* 這裡改為 page-preview-title 類名，確保 CSS 能控制它在列印時顯示 */}
                    <div className="flex justify-between items-center mb-2 border-b pb-1 page-preview-title">
                        <h4 className="font-bold text-gray-700 text-lg">
                            {title} <span className="text-sm font-normal text-gray-500">(書本 P.{pageNum})</span>
                        </h4>
                    </div>
                    <div className="shadow-none flex items-center justify-center relative bg-white">
                        {status === 'loading' && <div className="text-gray-400 text-sm py-10 no-print">正在載入頁面...</div>}
                        {status === 'error' && <div className="text-red-400 text-sm py-10 no-print">無法載入頁面 (超出範圍或錯誤)</div>}
                        <canvas 
                            ref={canvasRef} 
                            className="block mx-auto" 
                            style={{ 
                                width: '100%', 
                                height: 'auto', 
                                maxWidth: '210mm' 
                            }}
                        />
                    </div>
                </div>
            );
        };

        // --- 報告模態框組件 ---
        const ReportModal = ({ userDestiny, inputData, pdfDoc, pageOffset, onClose }) => {
            if (!userDestiny) return null;
            
            const zodiacInfo = ZODIAC_DATA[userDestiny.zodiac];
            const birthYearPage = zodiacInfo?.years[parseInt(inputData.year)];
            
            const pagesToPrint = [
                ...(userDestiny.fanTaiSui ? [{ title: "犯太歲化解", page: userDestiny.fanTaiSui.page }] : []),
                { title: `${userDestiny.zodiac}年整體運勢`, page: zodiacInfo?.page },
                { title: "財運 / 事業運", page: zodiacInfo?.wealth },
                { title: "感情 / 健康運", page: zodiacInfo?.health },
                ...(birthYearPage ? [{ title: `${inputData.year}年出生運程`, page: birthYearPage }] : []),
                { title: "每月運程 (通勝)", page: zodiacInfo?.monthly },
                { title: `日柱運勢 (${userDestiny.dayPillar}) - 上`, page: userDestiny.pillarPage },
                { title: `日柱運勢 (${userDestiny.dayPillar}) - 下`, page: userDestiny.pillarPage + 1 },
                { title: "開運風水佈局", page: GENERAL_PAGES.fengShuiLayout },
            ].filter(item => item.page);

            const handlePrint = (e) => {
                e.stopPropagation();
                if (typeof window !== 'undefined' && window.print) {
                    window.print();
                } else {
                    alert("您的設備不支援自動列印，請手動使用瀏覽器的列印功能。");
                }
            };

            return (
                <div id="report-modal" className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto report-container relative">
                        
                        {/* 頂部工具列 */}
                        <div className="sticky top-0 bg-gray-100 p-4 border-b flex justify-between items-center no-print z-20 shadow-sm">
                            <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                <Icon name="file-text" size={24} className="text-red-700"/>
                                運程導讀報告預覽
                            </h2>
                            <div className="flex gap-2">
                                <button 
                                    onClick={handlePrint}
                                    className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition shadow-sm font-bold"
                                >
                                    <Icon name="printer" size={18} /> 打包列印 / 存為 PDF
                                </button>
                                <button 
                                    onClick={onClose}
                                    className="flex items-center gap-2 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded transition shadow-sm"
                                >
                                    <Icon name="x" size={18} /> 關閉
                                </button>
                            </div>
                        </div>

                        {/* 報告內容 */}
                        <div className="p-8 md:p-12 print-content bg-white">
                            {/* 頁眉 */}
                            <div className="border-b-4 border-red-800 pb-4 mb-8 flex justify-between items-end break-after-avoid">
                                <div>
                                    <h1 className="text-3xl font-bold text-red-900">2026 蛇年運程專屬手冊</h1>
                                    <p className="text-gray-600 mt-2">個人命盤 • 重點索引 • 頁面剪報</p>
                                </div>
                                <div className="text-right text-sm text-gray-500">
                                    生成日期：{new Date().toLocaleDateString()}
                                </div>
                            </div>

                            {/* 命盤資訊 */}
                            <section className="mb-10 break-inside-avoid">
                                <h3 className="text-lg font-bold text-white bg-red-800 px-4 py-1 inline-block rounded-t-lg">01. 您的命盤</h3>
                                <div className="border-2 border-red-800 p-6 rounded-b-lg rounded-tr-lg bg-red-50">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                        <div>
                                            <p className="text-sm text-gray-500">姓名</p>
                                            <p className="text-xl font-bold text-gray-900">{inputData.name || '使用者'}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500">性別 / 出生年</p>
                                            <p className="text-xl font-bold text-gray-900">
                                                {inputData.gender === 'M' ? '男' : '女'} / {inputData.year}年
                                            </p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500">生肖</p>
                                            <p className="text-3xl font-bold text-red-700">{userDestiny.zodiac}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500">出生日柱</p>
                                            <div className="flex items-end gap-2">
                                                <p className="text-3xl font-bold text-purple-800">{userDestiny.dayPillar}</p>
                                                <span className="text-xs text-gray-400 mb-1">(第{userDestiny.pillarIndex + 1}位)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* 索引表格 */}
                            <section className="mb-10 break-inside-avoid">
                                <h3 className="text-lg font-bold text-white bg-red-800 px-4 py-1 inline-block rounded-t-lg">02. 閱讀索引</h3>
                                <div className="border border-gray-300 rounded-b-lg rounded-tr-lg overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-gray-100 text-gray-700">
                                            <tr>
                                                <th className="p-3 border-b border-gray-200">內容說明</th>
                                                <th className="p-3 border-b border-gray-200 w-32 text-center">書本頁碼</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {pagesToPrint.map((item, idx) => (
                                                <tr key={idx} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                    <td className="p-3 border-b border-gray-200 font-medium text-gray-800">{item.title}</td>
                                                    <td className="p-3 border-b border-gray-200 text-center font-bold text-red-700">P.{item.page}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </section>

                            {/* 導讀說明 */}
                            <section className="mb-12 break-inside-avoid">
                                <h3 className="text-lg font-bold text-white bg-gray-600 px-4 py-1 inline-block rounded-t-lg">03. 導讀說明</h3>
                                <div className="border border-gray-300 p-6 rounded-b-lg rounded-tr-lg text-sm text-gray-700 leading-relaxed space-y-3 bg-white">
                                    <p>
                                        <strong>★ 關於日柱：</strong>八字中「日柱」代表您自己（日元）及夫妻宮。相比生肖（年柱），日柱運勢能更精細地反映個人流年際遇，請務必詳讀。
                                    </p>
                                    {userDestiny.fanTaiSui && (
                                        <p className="text-red-800 bg-red-50 p-2 rounded">
                                            <strong>⚠️ 關於犯太歲：</strong>今年您屬於「{userDestiny.fanTaiSui.type}」。犯太歲代表變動與衝擊，建議年初做好化解儀式（攝太歲），並多行善舉以保平安。
                                        </p>
                                    )}
                                </div>
                            </section>
                            
                            <div className="print-break" style={{ pageBreakAfter: 'always', height: '1px' }}></div>

                            {/* 剪報 */}
                            <section className="no-overflow-check">
                                <div className="mb-6 break-inside-avoid no-print"> {/* Added no-print */}
                                    <h3 className="text-2xl font-bold text-gray-800 border-l-8 border-red-700 pl-4">04. 專屬運程書剪報</h3>
                                    <p className="text-gray-500 mt-1 pl-6">以下為系統自動從 PDF 擷取的個人專屬頁面</p>
                                </div>

                                {!pdfDoc ? (
                                     <div className="p-8 bg-gray-100 text-center rounded-lg border-2 border-dashed border-gray-300">
                                        <Icon name="alert-triangle" size={32} className="text-gray-400 mx-auto mb-2"/>
                                        <p className="text-gray-500 font-bold">尚未載入 PDF 文件</p>
                                        <p className="text-sm text-gray-400">請先在主畫面右上角上傳運程書 PDF，即可在此預覽頁面剪報。</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {pagesToPrint.map((item, index) => (
                                            <PdfPagePreview 
                                                key={index}
                                                title={`${index + 1}. ${item.title}`}
                                                pdfDoc={pdfDoc}
                                                pageNum={item.page}
                                                pageOffset={pageOffset}
                                                scale={2.0} 
                                            />
                                        ))}
                                    </div>
                                )}
                            </section>

                            <div className="text-center text-xs text-gray-400 mt-12 border-t pt-4 no-print">
                                2026 麥玲玲運程書智能閱讀器 • Generated Report
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ label, subLabel, page, currentPage, offset, onClick, highlight = false, color = "red" }) => {
            const targetPageWithOffset = page + parseInt(offset || 0);
            const isSelected = targetPageWithOffset === currentPage;
            
            return (
                <li 
                    onClick={() => onClick(page)}
                    className={`
                        cursor-pointer p-3 rounded-md text-sm transition flex justify-between items-center group
                        ${highlight ? 'bg-orange-100 text-orange-900 border border-orange-200 font-bold' : ''}
                        ${isSelected ? 'bg-red-100 text-red-800 border-l-4 border-red-600' : 'hover:bg-gray-100 text-gray-700 border-l-4 border-transparent'}
                    `}
                >
                    <div>
                        <span className="block">{label}</span>
                        {subLabel && <span className="text-xs text-gray-400 font-normal">{subLabel}</span>}
                    </div>
                    <div className="flex items-center gap-1">
                        <span className={`text-xs px-1.5 py-0.5 rounded group-hover:bg-gray-300 ${isSelected ? 'bg-red-200 text-red-800' : 'bg-gray-200 text-gray-500'}`}>
                            P.{page}
                        </span>
                        {isSelected && <Icon name="eye" size={14} className="text-red-600" />}
                    </div>
                </li>
            );
        };

        const App = () => {
            const [scriptsLoaded, setScriptsLoaded] = useState(false);
            
            // PDF 狀態
            const [pdfDoc, setPdfDoc] = useState(null);
            const [pageNum, setPageNum] = useState(1);
            const [pageCount, setPageCount] = useState(0);
            const [scale, setScale] = useState(1.2); 
            const [isRendering, setIsRendering] = useState(false);
            
            // PDF 校正預設 +7
            const [pageOffset, setPageOffset] = useState(7); 

            // 報告模態框狀態
            const [showReport, setShowReport] = useState(false);

            // 日期相關狀態
            const [calendarType, setCalendarType] = useState('solar'); // 'solar' or 'lunar'
            const [inputData, setInputData] = useState({
                name: '',
                year: '1990',
                month: '1',
                day: '1',
                hour: '12',
                gender: 'M'
            });
            const [lunarDate, setLunarDate] = useState({ year: 1990, month: 1, day: 1, isLeap: false });
            const [displayDateInfo, setDisplayDateInfo] = useState('');

            const [userDestiny, setUserDestiny] = useState(null);

            const canvasRef = useRef(null);
            const renderTaskRef = useRef(null);

            // 載入腳本
            useEffect(() => {
                const loadScript = (src) => {
                    return new Promise((resolve, reject) => {
                        if (document.querySelector(`script[src="${src}"]`)) {
                            resolve();
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = src;
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                };

                Promise.all([
                    loadScript("https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")
                ]).then(() => {
                    if (window.pdfjsLib) {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        setScriptsLoaded(true);
                        // 初始化顯示文字
                        updateDisplayInfo(1990, 1, 1, 'solar');
                    }
                }).catch(err => {
                    console.error("腳本載入失敗:", err);
                    alert("資源載入失敗，請檢查網路連接");
                });
            }, []);

            // 更新顯示資訊 (互轉邏輯)
            const updateDisplayInfo = (y, m, d, type, isLeap = false) => {
                if (!window.Solar || !window.Lunar) return;

                if (type === 'solar') {
                    try {
                        const solar = window.Solar.fromYmd(parseInt(y), parseInt(m), parseInt(d));
                        const lunar = solar.getLunar();
                        const displayStr = `農曆: ${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                        setDisplayDateInfo(displayStr);
                        // 同步更新農曆狀態，以便切換 tab 時數據正確
                        setLunarDate({
                            year: lunar.getYear(),
                            month: Math.abs(lunar.getMonth()), // lunar.getMonth() returns negative for leap month? lunar-js usually uses separate check
                            day: lunar.getDay(),
                            isLeap: false // 簡化處理
                        });
                    } catch (e) { setDisplayDateInfo("無效日期"); }
                } else {
                    try {
                        // 農曆轉公曆
                        // Lunar.fromYmd(lunarYear, lunarMonth, lunarDay)
                        // 若要處理閏月，通常 lunar-javascript 需要使用 Lunar.fromYmd(year, month, day) 並不會自動判斷閏月，
                        // 但如果是閏月，它會返回閏月對象如果月份是對的。
                        // 這裡使用簡單轉換，假設輸入的都是合法農曆
                        // 實際上 lunar-javascript 構建函數：Lunar.fromYmd(year, month, day)
                        // 如果有閏月，可能需要更複雜邏輯。這裡簡化：
                        const lunar = window.Lunar.fromYmd(parseInt(y), parseInt(m), parseInt(d));
                        // 如果有閏月選項且被勾選? lunar-js 有 .fromYmd(year, month, day) 
                        // 讓我們假設使用者輸入的是標準農曆
                        const solar = lunar.getSolar();
                        const displayStr = `西曆: ${solar.getYear()}年 ${solar.getMonth()}月 ${solar.getDay()}日`;
                        setDisplayDateInfo(displayStr);
                        
                        // 同步更新公曆狀態 (inputData 是源頭)
                        setInputData(prev => ({
                            ...prev,
                            year: solar.getYear(),
                            month: solar.getMonth(),
                            day: solar.getDay()
                        }));
                    } catch (e) { setDisplayDateInfo("無效日期"); }
                }
            };

            // 處理日期變更
            const handleSolarDateChange = (field, value) => {
                const newData = { ...inputData, [field]: value };
                setInputData(newData);
                updateDisplayInfo(newData.year, newData.month, newData.day, 'solar');
            };

            const handleLunarDateChange = (field, value) => {
                const newLunar = { ...lunarDate, [field]: value };
                setLunarDate(newLunar);
                updateDisplayInfo(newLunar.year, newLunar.month, newLunar.day, 'lunar', newLunar.isLeap);
            };

            // 處理上傳
            const handleFileChange = async (e) => {
                if (!scriptsLoaded) return;
                const file = e.target.files[0];
                if (file && file.type === "application/pdf") {
                    const fileReader = new FileReader();
                    fileReader.onload = function() {
                        const typedarray = new Uint8Array(this.result);
                        loadPdf(typedarray);
                    };
                    fileReader.readAsArrayBuffer(file);
                } else {
                    alert("請上傳有效的 PDF 文件");
                }
            };

            const loadPdf = async (data) => {
                try {
                    const loadingTask = window.pdfjsLib.getDocument(data);
                    const pdf = await loadingTask.promise;
                    setPdfDoc(pdf);
                    setPageCount(pdf.numPages);
                    setPageNum(1); 
                } catch (error) {
                    console.error("PDF 載入失敗:", error);
                    alert("PDF 載入失敗，請確保檔案未損壞。");
                }
            };

            const renderPage = useCallback(async () => {
                if (!pdfDoc) return;
                
                if (renderTaskRef.current) {
                    renderTaskRef.current.cancel();
                }

                setIsRendering(true);

                try {
                    const page = await pdfDoc.getPage(pageNum);
                    const canvas = canvasRef.current;
                    if (!canvas) return;

                    const viewport = page.getViewport({ scale });
                    const context = canvas.getContext('2d');

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    const renderTask = page.render(renderContext);
                    renderTaskRef.current = renderTask;

                    await renderTask.promise;
                } catch (err) {
                    if (err?.name === 'RenderingCancelledException') {
                        // Ignore
                    } else {
                        console.error("渲染錯誤:", err);
                    }
                } finally {
                    renderTaskRef.current = null;
                    setIsRendering(false);
                }
            }, [pdfDoc, pageNum, scale]);

            useEffect(() => {
                renderPage();
            }, [renderPage]);

            const calculateDestiny = () => {
                if (!window.Solar) {
                    alert("計算模組尚未載入完成，請稍候");
                    return;
                }

                // 無論當前是在哪個 tab，我們都使用 inputData (公曆) 進行最終計算
                const { year, month, day, hour } = inputData;
                const solar = window.Solar.fromYmdHms(parseInt(year), parseInt(month), parseInt(day), parseInt(hour), 0, 0);
                const lunar = solar.getLunar();
                
                let baziYear = lunar.getYearShengXiaoExact(); 
                if (ZODIAC_MAP[baziYear]) {
                    baziYear = ZODIAC_MAP[baziYear];
                }

                const dayPillar = lunar.getDayInGanZhi(); 
                const yearGanZhi = lunar.getYearInGanZhi(); 

                const pillarIndex = JIA_ZI.indexOf(dayPillar);
                const pillarPage = Math.floor(DAY_PILLAR_START_PAGE + (pillarIndex * PAGES_PER_PILLAR));

                setUserDestiny({
                    name: inputData.name || '使用者',
                    zodiac: baziYear,
                    dayPillar: dayPillar,
                    yearGanZhi: yearGanZhi,
                    fanTaiSui: FAN_TAI_SUI_RULES[baziYear] || null,
                    pillarIndex: pillarIndex,
                    pillarPage: pillarPage
                });
            };

            const goToPage = (targetPage) => {
                let finalPage = targetPage + parseInt(pageOffset || 0);
                if (finalPage < 1) finalPage = 1;
                if (pdfDoc && finalPage > pdfDoc.numPages) finalPage = pdfDoc.numPages;
                setPageNum(finalPage);
            };

            const changePage = (offset) => {
                goToPage(pageNum + offset - parseInt(pageOffset || 0)); 
            };

            // 側邊欄渲染
            const renderSidebar = () => {
                if (!userDestiny) return (
                    <div className="p-4 text-gray-500 text-sm">
                        請先輸入出生資料以生成專屬目錄。
                    </div>
                );

                const zodiacInfo = ZODIAC_DATA[userDestiny.zodiac];
                if (!zodiacInfo) {
                    return <div className="p-4 bg-red-100 text-red-800 text-sm">錯誤：找不到生肖數據。</div>;
                }

                const birthYearPage = zodiacInfo?.years[parseInt(inputData.year)];

                return (
                    <div className="space-y-6 pb-20">
                        {/* 命盤概況 */}
                        <div className="bg-red-50 p-4 rounded-lg border border-red-100">
                            <h3 className="font-bold text-red-800 text-lg flex items-center gap-2">
                                <Icon name="user" size={18} />
                                {userDestiny.name} 的命盤
                            </h3>
                            <div className="mt-2 text-sm text-gray-700 space-y-1">
                                <p>生肖：<span className="font-bold">{userDestiny.zodiac}</span></p>
                                <p>日柱：<span className="font-bold">{userDestiny.dayPillar}</span> (第 {userDestiny.pillarIndex + 1} 位)</p>
                            </div>
                        </div>

                        {/* 報告生成按鈕 */}
                        <button 
                            onClick={() => setShowReport(true)}
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded shadow-md flex items-center justify-center gap-2 transition font-bold border border-blue-800"
                        >
                            <Icon name="layers" size={18} />
                            📄 生成運程書頁面剪報
                        </button>

                        {userDestiny.fanTaiSui && (
                            <div className="bg-red-600 text-white p-4 rounded-lg shadow-md cursor-pointer hover:bg-red-700 transition"
                                 onClick={() => goToPage(userDestiny.fanTaiSui.page)}>
                                <h3 className="font-bold flex items-center gap-2 mb-1">
                                    <Icon name="alert-triangle" size={18} />
                                    2026 犯太歲：{userDestiny.fanTaiSui.type}
                                </h3>
                                <p className="text-xs opacity-90">{userDestiny.fanTaiSui.desc}</p>
                                <div className="mt-2 text-xs bg-white/20 inline-block px-2 py-1 rounded">
                                    點擊查看化解錦囊 (P.{userDestiny.fanTaiSui.page})
                                </div>
                            </div>
                        )}

                        <div>
                            <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-red-500">
                                <Icon name="book-open" size={18} />
                                生肖運程 ({userDestiny.zodiac})
                            </h3>
                            <ul className="space-y-2">
                                <SidebarItem label="整體運勢" page={zodiacInfo.page} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="財運 / 事業" page={zodiacInfo.wealth} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="感情 / 健康" page={zodiacInfo.health} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                {birthYearPage && (
                                    <SidebarItem 
                                        label={`${inputData.year}年出生運程`} 
                                        page={birthYearPage} 
                                        highlight={true}
                                        currentPage={pageNum}
                                        offset={pageOffset}
                                        onClick={goToPage} 
                                    />
                                )}
                                <SidebarItem label="每月運程 (通勝)" page={zodiacInfo.monthly} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                            </ul>
                        </div>

                        <div>
                            <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-purple-500">
                                <Icon name="star" size={18} />
                                出生日柱運勢
                            </h3>
                            <ul className="space-y-2">
                                <SidebarItem 
                                    label={`您的日柱：${userDestiny.dayPillar}`} 
                                    subLabel={`精確定位：P.${userDestiny.pillarPage}`}
                                    page={userDestiny.pillarPage} 
                                    onClick={goToPage} 
                                    currentPage={pageNum}
                                    offset={pageOffset}
                                    color="purple"
                                />
                                <div className="text-xs text-gray-400 px-2 mt-1">
                                    *每個日柱佔 2 頁，此處連結到該日柱的首頁。
                                </div>
                            </ul>
                        </div>

                        <div>
                            <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-yellow-500">
                                <Icon name="compass" size={18} />
                                風水與通用
                            </h3>
                            <ul className="space-y-2">
                                <SidebarItem label="2026 世界大勢" page={GENERAL_PAGES.worldTrend} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="九宮飛星圖" page={GENERAL_PAGES.fengShuiChart} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="行好運風水佈局" page={GENERAL_PAGES.fengShuiLayout} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="開運飾物配對" page={GENERAL_PAGES.accessories} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="每日通勝" page={GENERAL_PAGES.calendar} currentPage={pageNum} offset={pageOffset} onClick={goToPage} />
                            </ul>
                        </div>
                    </div>
                );
            };

            if (!scriptsLoaded) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-gray-50 text-gray-600">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-red-700 mb-4"></div>
                        <p>正在初始化系統資源 (PDF引擎 & 農曆算法)...</p>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen overflow-hidden font-sans text-gray-800 bg-[#fdfbf7] app-container">
                    
                    {/* 報告模態框 */}
                    {showReport && (
                        <ReportModal 
                            userDestiny={userDestiny} 
                            inputData={inputData} 
                            pdfDoc={pdfDoc}
                            pageOffset={pageOffset}
                            onClose={() => setShowReport(false)} 
                        />
                    )}

                    {/* Header */}
                    <header className="bg-red-800 text-white h-14 flex items-center px-4 md:px-6 justify-between shadow-lg z-10 shrink-0 no-print">
                        <div className="flex items-center gap-2 font-bold text-lg overflow-hidden whitespace-nowrap">
                            <Icon name="file-text" />
                            <span className="hidden md:inline">2026 麥玲玲運程書 - </span>智能瀏覽器
                        </div>
                        
                        <div className="flex items-center gap-2">
                            {pdfDoc && (
                                <>
                                    <div className="flex items-center bg-red-900 rounded px-2 py-1 gap-2">
                                        <button onClick={() => changePage(-1)} disabled={pageNum <= 1} className="hover:text-red-300 disabled:opacity-30">
                                            <Icon name="chevron-left" size={20}/>
                                        </button>
                                        <span className="text-sm font-mono w-16 text-center">{pageNum} / {pageCount}</span>
                                        <button onClick={() => changePage(1)} disabled={pageNum >= pageCount} className="hover:text-red-300 disabled:opacity-30">
                                            <Icon name="chevron-right" size={20}/>
                                        </button>
                                    </div>

                                    <div className="flex items-center bg-red-900 rounded px-2 py-1 gap-2 hidden md:flex">
                                        <button onClick={() => setScale(s => Math.max(0.5, s - 0.2))} className="hover:text-red-300">
                                            <Icon name="minus" size={16}/>
                                        </button>
                                        <span className="text-xs">{Math.round(scale * 100)}%</span>
                                        <button onClick={() => setScale(s => Math.min(3.0, s + 0.2))} className="hover:text-red-300">
                                            <Icon name="plus" size={16}/>
                                        </button>
                                    </div>
                                </>
                            )}
                            
                            <div className="text-xs md:text-sm bg-red-900 px-3 py-1 rounded flex items-center gap-2 ml-2">
                                <span className="hidden md:inline">PDF 校正:</span>
                                <input 
                                    type="number" 
                                    value={pageOffset} 
                                    onChange={(e) => setPageOffset(e.target.value)}
                                    className="w-12 text-black px-1 rounded text-center"
                                />
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className="flex flex-1 overflow-hidden no-print">
                        {/* Sidebar */}
                        <div className="w-80 bg-white border-r border-gray-200 flex flex-col h-full shadow-lg z-10 shrink-0">
                            <div className="p-4 border-b border-gray-200 bg-gray-50 shrink-0">
                                <div className="space-y-3">
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="姓名" 
                                            className="flex-1 p-2 border rounded text-sm"
                                            value={inputData.name}
                                            onChange={(e) => setInputData({...inputData, name: e.target.value})}
                                        />
                                        <select 
                                            className="w-20 p-2 border rounded text-sm"
                                            value={inputData.gender}
                                            onChange={(e) => setInputData({...inputData, gender: e.target.value})}
                                        >
                                            <option value="M">男</option>
                                            <option value="F">女</option>
                                        </select>
                                    </div>

                                    {/* 曆法切換 Tabs */}
                                    <div className="flex border border-red-200 rounded overflow-hidden">
                                        <button 
                                            className={`flex-1 py-1 text-xs font-bold transition ${calendarType === 'solar' ? 'bg-red-100 text-red-800' : 'bg-white text-gray-500 hover:bg-gray-50'}`}
                                            onClick={() => setCalendarType('solar')}
                                        >
                                            <div className="flex items-center justify-center gap-1">
                                                <Icon name="sun" size={12}/> 公曆 (西曆)
                                            </div>
                                        </button>
                                        <button 
                                            className={`flex-1 py-1 text-xs font-bold transition ${calendarType === 'lunar' ? 'bg-purple-100 text-purple-800' : 'bg-white text-gray-500 hover:bg-gray-50'}`}
                                            onClick={() => setCalendarType('lunar')}
                                        >
                                            <div className="flex items-center justify-center gap-1">
                                                <Icon name="moon" size={12}/> 農曆
                                            </div>
                                        </button>
                                    </div>

                                    {/* 日期輸入區 */}
                                    {calendarType === 'solar' ? (
                                        <div className="flex gap-1">
                                            <input type="number" placeholder="年" className="w-1/3 p-2 border rounded text-sm" value={inputData.year} onChange={(e) => handleSolarDateChange('year', e.target.value)} />
                                            <input type="number" placeholder="月" className="w-1/3 p-2 border rounded text-sm" value={inputData.month} onChange={(e) => handleSolarDateChange('month', e.target.value)} />
                                            <input type="number" placeholder="日" className="w-1/3 p-2 border rounded text-sm" value={inputData.day} onChange={(e) => handleSolarDateChange('day', e.target.value)} />
                                        </div>
                                    ) : (
                                        <div className="flex gap-1">
                                            <input type="number" placeholder="農曆年" className="w-1/3 p-2 border rounded text-sm" value={lunarDate.year} onChange={(e) => handleLunarDateChange('year', e.target.value)} />
                                            <input type="number" placeholder="農曆月" className="w-1/3 p-2 border rounded text-sm" value={lunarDate.month} onChange={(e) => handleLunarDateChange('month', e.target.value)} />
                                            <input type="number" placeholder="農曆日" className="w-1/3 p-2 border rounded text-sm" value={lunarDate.day} onChange={(e) => handleLunarDateChange('day', e.target.value)} />
                                        </div>
                                    )}

                                    {/* 自動轉換顯示區 */}
                                    <div className={`text-xs text-center p-1 rounded font-mono ${calendarType === 'solar' ? 'bg-purple-50 text-purple-700' : 'bg-red-50 text-red-700'}`}>
                                        {displayDateInfo}
                                    </div>

                                    <button 
                                        onClick={calculateDestiny}
                                        className="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm font-bold transition flex justify-center items-center gap-2"
                                    >
                                        <Icon name="search" size={16} />
                                        開始分析 / 生成目錄
                                    </button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto p-2 scrollbar-hide">
                                {renderSidebar()}
                            </div>

                            <div className="p-4 border-t border-gray-200 bg-gray-100 shrink-0 text-center">
                                <label className="cursor-pointer block">
                                    <span className="bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-4 rounded text-sm block w-full transition font-medium">
                                        {pdfDoc ? "更換 PDF 文件" : "📁 點擊上傳 PDF (建議)"}
                                    </span>
                                    <input type="file" className="hidden" accept=".pdf" onChange={handleFileChange} />
                                </label>
                            </div>
                        </div>

                        {/* PDF Viewer */}
                        <div className="flex-1 bg-gray-600 h-full relative overflow-auto flex justify-center p-4 md:p-8">
                            {pdfDoc ? (
                                <div className="relative">
                                    <canvas ref={canvasRef} className="shadow-2xl bg-white max-w-full" />
                                    {isRendering && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-white/50 z-10">
                                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-red-700"></div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-gray-300 space-y-4">
                                    <Icon name="book-open" size={80} className="opacity-50" />
                                    <div className="text-center">
                                        <p className="text-xl font-bold mb-2">請上傳「2026年麥玲玲運程」PDF</p>
                                        <p className="text-sm opacity-70">
                                            上傳後，點擊左側目錄即可自動翻到對應頁面<br/>
                                            (支援 Chrome / Safari / Edge / Firefox)
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
