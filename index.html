<!DOCTYPE html>

    <title>麥玲玲運程書 - 專屬報告生成器 (2026/2027)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- 封面截圖引擎 -->

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdfbf7; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        canvas { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background-color: white; }

        @media print {
            @page { size: A4; margin: 10mm; }
            html, body, #root, .app-container { height: auto !important; min-height: 0 !important; overflow: visible !important; overflow-y: visible !important; }
            body * { visibility: hidden; }
            #report-modal, #report-modal * { visibility: visible; }
            #report-modal {
                position: absolute !important; top: 0 !important; left: 0 !important;
                width: 100% !important; height: auto !important;
                margin: 0 !important; padding: 0 !important;
                background: white !important; z-index: 9999 !important;
                display: block !important; overflow: visible !important;
            }
            .report-container { box-shadow: none !important; max-width: none !important; width: 100% !important; position: static !important; height: auto !important; overflow: visible !important; }
            .no-print { display: none !important; }
            .print-content { padding: 0 !important; }
            .page-preview-item { page-break-inside: avoid; break-inside: avoid; display: block; margin-bottom: 0 !important; padding-bottom: 0 !important; height: auto; max-height: 275mm; overflow: hidden; }
            .page-preview-item:not(:last-child) { page-break-after: always; break-after: page; }
        }
    </style>
</head>

    <script type="text/babel">

            'globe': <g><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></g>,

        const Icon = ({ name, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {ICONS[name] || ICONS['star']}
            </svg>
        );

        // --- 動態生成 2027 頁面資料庫 ---
        const zodiacs2027 = ["羊", "猴", "雞", "狗", "豬", "鼠", "牛", "虎", "兔", "龍", "蛇", "馬"];
        const ZODIAC_DATA_2027 = {};
        zodiacs2027.forEach((z, idx) => {
            const start = 46 + (idx * 10);
            ZODIAC_DATA_2027[z] = {
                strategy: 32 + idx,       
                general: [start, start + 3], 
                years: [start + 4, start + 6], 
                monthly: [start + 7, start + 9] 
            };
        });

        const YEAR_CONFIGS = {
            '2026': {
                yearTitle: '2026 丙午馬年',
                pdfName: '2026年麥玲玲運程.pdf',
                DAY_PILLAR_START_PAGE: 254,
                FAN_TAI_SUI_RULES: {

                    "牛": { type: "害太歲", page: 21, pages: [20, 22], desc: "小人作祟，陷害之意，保持低調。" }
                },
                GENERAL_PAGES: { worldTrend: 8, fengShuiChart: 10, accessories: 28, fengShuiLayout: 376, calendar: 422 },
                ZODIAC_DATA: {
                    "馬": { general: [42, 45], years: [46, 48], monthly: [49, 51], strategy: 28 },
                    "羊": { general: [52, 55], years: [56, 58], monthly: [59, 61], strategy: 28 },
                    "猴": { general: [62, 65], years: [66, 68], monthly: [69, 71], strategy: 28 },
                    "雞": { general: [72, 75], years: [76, 78], monthly: [79, 81], strategy: 28 },
                    "狗": { general: [82, 85], years: [86, 88], monthly: [89, 91], strategy: 28 },
                    "豬": { general: [92, 95], years: [96, 98], monthly: [99, 99], strategy: 28 },
                    "鼠": { general: [100, 105], years: [106, 108], monthly: [109, 111], strategy: 28 },
                    "牛": { general: [112, 115], years: [116, 118], monthly: [119, 121], strategy: 28 },
                    "虎": { general: [122, 125], years: [126, 128], monthly: [129, 131], strategy: 28 },
                    "兔": { general: [132, 135], years: [136, 138], monthly: [139, 141], strategy: 28 },
                    "龍": { general: [142, 145], years: [146, 148], monthly: [149, 149], strategy: 28 },
                    "蛇": { general: [150, 155], years: [156, 158], monthly: [159, 161], strategy: 28 }
                }
            },
            '2027': {
                yearTitle: '2027 丁未羊年',
                pdfName: '麥玲玲2027羊年YC電子書449p完整版（已优化）.pdf',
                DAY_PILLAR_START_PAGE: 258,
                FAN_TAI_SUI_RULES: {
                    "羊": { type: "本命年犯太歲", page: 23, pages: [23, 30], desc: "運勢波動，情緒易受困擾，宜辦喜事沖喜或佩戴馬形飾物。詳見錦囊 23-30 頁。" },
                    "牛": { type: "沖太歲 + 刑太歲", page: 23, pages: [23, 30], desc: "變化最大，易有各種變動及人際衝擊，宜佩戴蛇形及雞形飾物。詳見錦囊 23-30 頁。" },
                    "狗": { type: "刑太歲 + 破太歲", page: 23, pages: [23, 30], desc: "易惹是非及固有關係受破壞，宜保持低調並佩戴兔形飾物。詳見錦囊 23-30 頁。" },
                    "鼠": { type: "害太歲", page: 23, pages: [23, 30], desc: "易有小人暗中陷害，慎言慎行，宜佩戴猴形及龍形飾物。詳見錦囊 23-30 頁。" }
                },
                GENERAL_PAGES: { worldTrend: 1, fengShuiChart: 3, accessories: 31, fengShuiLayout: 379, calendar: 425 },
                ZODIAC_DATA: ZODIAC_DATA_2027
            }
        };

        const ZODIAC_MAP = {
            '马': '馬', '鸡': '雞', '猪': '豬', '龙': '龍',
            '馬': '馬', '羊': '羊', '猴': '猴', '雞': '雞', '狗': '狗', '豬': '豬',
            '鼠': '鼠', '牛': '牛', '虎': '虎', '兔': '兔', '龍': '龍', '蛇': '蛇'
        };

        const PAGES_PER_PILLAR = 2; 
        const JIA_ZI = [
            "甲子", "乙丑", "丙寅", "丁卯", "戊辰", "己巳", "庚午", "辛未", "壬申", "癸酉",
            "甲戌", "乙亥", "丙子", "丁丑", "戊寅", "己卯", "庚辰", "辛巳", "壬午", "癸未",
            "甲申", "乙酉", "丙戌", "丁亥", "戊子", "己丑", "庚寅", "辛卯", "壬辰", "癸巳",
            "甲午", "乙未", "丙申", "丁酉", "戊戌", "己亥", "庚子", "辛丑", "壬寅", "癸卯",
            "甲辰", "乙巳", "丙午", "丁未", "戊申", "己酉", "庚戌", "辛亥", "壬子", "癸丑",
            "甲寅", "乙卯", "丙辰", "丁巳", "戊午", "己未", "庚申", "辛酉", "壬戌", "癸亥"
        ];

        const getPages = (start, end) => {
            if (!start || !end) return [];
            return Array.from({ length: end - start + 1 }, (_, i) => start + i);
        };

        // --- Canvas 輔助函數：將中文字轉換為透明背景的 PNG ---
        // 這是為了解決 pdf-lib 無法直接輸出中文字的問題
        const createTextCanvas = (text, fontSize, color, isBold = true) => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const fontString = `${isBold ? 'bold' : 'normal'} ${fontSize}px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif`;
            ctx.font = fontString;
            const metrics = ctx.measureText(text);
            
            // 加入一些緩衝空間防止字體被截斷
            canvas.width = Math.ceil(metrics.width) + 10; 
            canvas.height = fontSize + 15; 
            
            // 重新設定 (因為調整 width/height 會重置 context)
            ctx.font = fontString;
            ctx.fillStyle = color;
            ctx.textBaseline = 'top';
            ctx.fillText(text, 5, 5);
            return canvas.toDataURL('image/png');
        };

        // --- 單頁預覽組件 ---
        const PdfPagePreview = ({ pdfDoc, pageNum, pageOffset, scale = 1.2, title }) => {
            const canvasRef = useRef(null);
            const [status, setStatus] = useState('loading'); 

            useEffect(() => {
                if (!pdfDoc || !pageNum) return;
                let renderTask = null;
                const render = async () => {
                    try {
                        const actualPageNum = pageNum + parseInt(pageOffset);
                        if (actualPageNum < 1 || actualPageNum > pdfDoc.numPages) {
                            setStatus('error'); return;
                        }
                        const page = await pdfDoc.getPage(actualPageNum);
                        const canvas = canvasRef.current;
                        if (!canvas) return;

                        const viewport = page.getViewport({ scale });
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        renderTask = page.render({ canvasContext: context, viewport: viewport });
                        await renderTask.promise;
                        setStatus('success');
                    } catch (error) { setStatus('error'); }
                };
                render();
                return () => { if (renderTask) renderTask.cancel(); };
            }, [pdfDoc, pageNum, pageOffset, scale]);

            return (
                <div className="mb-4 rounded-lg overflow-hidden border border-gray-300 shadow-sm bg-white">
                    <div className="bg-gray-100 p-2 border-b text-sm font-bold text-gray-700 flex justify-between items-center">
                        <span>{title}</span>
                        <span className="text-gray-400 font-normal">書本 P.{pageNum}</span>
                    </div>
                    <div className="flex items-center justify-center p-4">
                        {status === 'loading' && <div className="text-gray-400 text-sm py-10">正在載入頁面...</div>}
                        {status === 'error' && <div className="text-red-400 text-sm py-10">無法載入頁面</div>}
                        <canvas ref={canvasRef} className="max-w-full h-auto shadow" />
                    </div>
                </div>
            );
        };

        // --- 報告模態框 (原生 PDF 匯出引擎 2.0 帶主題框架) ---
        const ReportModal = ({ userDestiny, inputData, pdfDoc, rawPdfBytes, pageOffset, currentConfig, selectedYear, onClose }) => {
            const [exportStatus, setExportStatus] = useState('');
            const [includeWorldTrend, setIncludeWorldTrend] = useState(false);
            const [includeCalendar, setIncludeCalendar] = useState(false);

            if (!userDestiny || !currentConfig) return null;
            const zodiacInfo = currentConfig.ZODIAC_DATA[userDestiny.zodiac];
            
            let pagesToPrint = [];
            if (selectedYear === '2027') {
                if (includeWorldTrend) { pagesToPrint.push({ title: "羊年世界大勢總論", pages: getPages(1, 13) }); }
                pagesToPrint.push({ title: `開運攻略 - 肖${userDestiny.zodiac}`, pages: getPages(zodiacInfo.strategy, zodiacInfo.strategy) });
                if (userDestiny.fanTaiSui) { pagesToPrint.push({ title: "犯太歲化解錦囊", pages: getPages(23, 30) }); }
                pagesToPrint.push(
                    { title: `${userDestiny.zodiac}年整體運勢`, pages: getPages(zodiacInfo.general[0], zodiacInfo.general[1]) },
                    { title: "各年份出生運程", pages: getPages(zodiacInfo.years[0], zodiacInfo.years[1]) },
                    { title: "每月運程分析", pages: getPages(zodiacInfo.monthly[0], zodiacInfo.monthly[1]) },
                    { title: `日柱運勢 (${userDestiny.dayPillar})`, pages: getPages(userDestiny.pillarPage, userDestiny.pillarPage + 1) },
                    { title: "九大吉凶方位", pages: getPages(379, 389) },
                    { title: "家居全方位風水陣", pages: getPages(390, 394) },
                    { title: "過年習俗知識", pages: getPages(395, 399) },
                    { title: "簡易與辦公室風水陣", pages: getPages(400, 401) },
                    { title: "羊年吉時吉日", pages: getPages(413, 424) }
                );
                if (includeCalendar) { pagesToPrint.push({ title: "羊年每日通勝", pages: getPages(425, 449) }); }
            } else {
                pagesToPrint.push(
                    { title: `${userDestiny.zodiac}年整體運勢`, pages: getPages(zodiacInfo.general[0], zodiacInfo.general[1]) },
                    { title: "各年份出生運程", pages: getPages(zodiacInfo.years[0], zodiacInfo.years[1]) },
                    { title: "每月運程分析", pages: getPages(zodiacInfo.monthly[0], zodiacInfo.monthly[1]) },
                    { title: `日柱運勢 (${userDestiny.dayPillar})`, pages: getPages(userDestiny.pillarPage, userDestiny.pillarPage + 1) }
                );
            }

            const totalPages = pagesToPrint.reduce((acc, val) => acc + val.pages.length, 0);

            const handleExportNativePDF = async () => {
                if (!rawPdfBytes) { alert("找不到原始電子書檔案，請重新上傳。"); return; }
                
                try {
                    const { PDFDocument, rgb } = window.PDFLib;
                    
                    setExportStatus('正在生成報告封面...');
                    await new Promise(resolve => setTimeout(resolve, 100)); // 讓 React 渲染 UI

                    // 1. 抓取封面截圖
                    const coverElement = document.getElementById('report-cover-section');
                    const originalTransform = coverElement.style.transform;
                    coverElement.style.transform = "none"; 
                    
                    const canvas = await html2canvas(coverElement, { 
                        scale: 2, useCORS: true, backgroundColor: "#ffffff", windowWidth: 800 
                    });
                    const coverImageBytes = canvas.toDataURL('image/jpeg', 0.95);
                    coverElement.style.transform = originalTransform;

                    const newPdf = await PDFDocument.create();
                    
                    // 2. 畫上封面
                    const coverImage = await newPdf.embedJpg(coverImageBytes);
                    const a4Width = 595.28, a4Height = 841.89;
                    const coverPage = newPdf.addPage([a4Width, a4Height]);
                    const coverDims = coverImage.scaleToFit(a4Width, a4Height);
                    coverPage.drawImage(coverImage, { 
                        x: (a4Width - coverDims.width) / 2, 
                        y: a4Height - coverDims.height, 
                        width: coverDims.width, 
                        height: coverDims.height 
                    });

                    // 3. 收集所有需要提取的頁面與其 Metadata
                    setExportStatus('正在解析原始書本內容...');
                    await new Promise(resolve => setTimeout(resolve, 50));

                    const originalPdf = await PDFDocument.load(rawPdfBytes, { ignoreEncryption: true });
                    const maxPages = originalPdf.getPageCount();
                    
                    let pageLayoutInfo = [];
                    let globalIndex = 0;
                    pagesToPrint.forEach(item => {
                        item.pages.forEach(p => {
                            const actualIndex = p + parseInt(pageOffset) - 1;
                            if (actualIndex >= 0 && actualIndex < maxPages) { 
                                globalIndex++;
                                pageLayoutInfo.push({
                                    title: item.title,
                                    originalPageNum: p,
                                    actualIndex: actualIndex,
                                    globalIndex: globalIndex
                                });
                            }
                        });
                    });
                    
                    // 4. 開始處理每一頁 (帶主題框架)
                    if (pageLayoutInfo.length > 0) {
                        const indices = pageLayoutInfo.map(info => info.actualIndex);
                        const embeddedPages = await newPdf.embedPdf(rawPdfBytes, indices);

                        for (let i = 0; i < embeddedPages.length; i++) {
                            setExportStatus(`正在合成主題頁面 (${i + 1}/${totalPages})...`);
                            await new Promise(resolve => setTimeout(resolve, 10)); // 釋放主線程防當機

                            const ep = embeddedPages[i];
                            const info = pageLayoutInfo[i];
                            const page = newPdf.addPage([a4Width, a4Height]);
                            
                            // 背景底色 (非常淺的米色)
                            page.drawRectangle({ x: 0, y: 0, width: a4Width, height: a4Height, color: rgb(0.99, 0.98, 0.96) });
                            
                            // --- 頂部 Header 框架 ---
                            const topBarHeight = 45;
                            const margin = 25;
                            // 紅色背景條
                            page.drawRectangle({ 
                                x: margin, y: a4Height - margin - topBarHeight, 
                                width: a4Width - margin * 2, height: topBarHeight, 
                                color: rgb(0.55, 0.11, 0.11) 
                            });
                            
                            // 頂部標題文字 (透過 Canvas 轉 PNG 畫出中文字)
                            const titleStr = `【 ${info.title} 】   原書 P.${info.originalPageNum}`;
                            const titleData = createTextCanvas(titleStr, 24, '#ffffff', true);
                            const titleImg = await newPdf.embedPng(titleData);
                            
                            // 計算圖片縮放以適應 Header
                            const titleScale = 0.65;
                            page.drawImage(titleImg, { 
                                x: margin + 15, 
                                y: a4Height - margin - topBarHeight + ((topBarHeight - titleImg.height * titleScale) / 2), 
                                width: titleImg.width * titleScale, 
                                height: titleImg.height * titleScale 
                            });

                            // --- 底部 Footer 與進度條 ---
                            const bottomBarHeight = 35;
                            page.drawRectangle({ 
                                x: margin, y: margin, 
                                width: a4Width - margin * 2, height: bottomBarHeight, 
                                color: rgb(0.9, 0.9, 0.9) 
                            });

                            // 底部進度條 (紅線)
                            const progressWidth = ((a4Width - margin * 2) * info.globalIndex) / totalPages;
                            page.drawRectangle({ 
                                x: margin, y: margin, 
                                width: progressWidth, height: 4, 
                                color: rgb(0.7, 0.1, 0.1) 
                            });

                            // 底部文字
                            const footerStr = `${currentConfig.reportTitle} • 專屬頁面 ${info.globalIndex} / ${totalPages}`;
                            const footerData = createTextCanvas(footerStr, 18, '#555555', false);
                            const footerImg = await newPdf.embedPng(footerData);
                            page.drawImage(footerImg, { 
                                x: a4Width - margin - (footerImg.width * 0.6) - 10, 
                                y: margin + ((bottomBarHeight - footerImg.height * 0.6) / 2) + 2, 
                                width: footerImg.width * 0.6, 
                                height: footerImg.height * 0.6 
                            });

                            // --- 繪製原書頁面 ---
                            const contentWidth = a4Width - margin * 2;
                            const contentHeight = a4Height - margin * 2 - topBarHeight - bottomBarHeight - 20; // 留點空隙
                            const dims = ep.scaleToFit(contentWidth, contentHeight);
                            
                            page.drawPage(ep, {
                                x: margin + (contentWidth - dims.width) / 2,
                                y: margin + bottomBarHeight + 10 + (contentHeight - dims.height) / 2,
                                width: dims.width,
                                height: dims.height,
                            });
                        }
                    }
                    
                    setExportStatus('正在封裝 PDF 檔案...');
                    await new Promise(resolve => setTimeout(resolve, 50));
                    
                    const pdfBytes = await newPdf.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${inputData.name || '專屬'}_${currentConfig.yearTitle}運程報告.pdf`;
                    document.body.appendChild(link);
                    link.click(); 
                    document.body.removeChild(link);
                    
                } catch (error) {
                    console.error("PDF Export Error:", error);
                    alert("匯出 PDF 時發生錯誤。請嘗試取消勾選「世界大勢」或「每日通勝」章節再試一次。");
                } finally { 
                    setExportStatus(''); 
                }
            };

            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                    <div className="bg-gray-100 rounded-lg shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col relative overflow-hidden">
                        
                        <div className="bg-white p-4 border-b flex justify-between items-center z-10 shrink-0 shadow-sm">

                                    {exportStatus !== '' ? <div className="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div> : <Icon name="download" size={18} />}
                                    {exportStatus !== '' ? exportStatus : '📥 開始匯出專屬 PDF'}
                                </button>

                        <div className="bg-orange-50 p-4 border-b flex flex-wrap gap-6 shrink-0 items-center justify-center">

                        </div>

                        <div className="flex-1 overflow-y-auto p-8 bg-gray-300 flex flex-col items-center">
                            {/* 給 html2canvas 截圖的封面 */}
                            <div id="report-cover-section" className="bg-white shadow-xl mb-8 border border-gray-200" style={{ width: '794px', minHeight: '1123px', padding: '50px 70px' }}>
                                <div className="border-b-4 border-red-800 pb-6 mb-10 flex justify-between items-end">
                                    <div>
                                        <h1 className="text-5xl font-bold text-red-900 leading-tight">{currentConfig.yearTitle}<br/>專屬運程手冊</h1>
                                        <p className="text-gray-500 mt-4 text-xl">麥玲玲原版授權內容 • 個人命盤與重點導讀</p>
                                    </div>
                                </div>
                                <section className="mb-12">
                                    <h3 className="text-2xl font-bold text-white bg-red-800 px-6 py-2 inline-block rounded-t-xl">01. 您的八字命盤</h3>
                                    <div className="border-2 border-red-800 p-8 rounded-b-xl rounded-tr-xl bg-red-50">
                                        <div className="grid grid-cols-2 gap-10">
                                            <div><p className="text-gray-500 mb-2 text-lg">姓名 / 性別</p><p className="text-3xl font-bold text-gray-900">{inputData.name || '使用者'} ({inputData.gender === 'M' ? '男' : '女'})</p></div>
                                            <div><p className="text-gray-500 mb-2 text-lg">西曆出生</p><p className="text-3xl font-bold text-gray-900">{inputData.year}年{inputData.month}月{inputData.day}日</p></div>
                                            <div><p className="text-gray-500 mb-2 text-lg">所屬生肖</p><p className="text-5xl font-bold text-red-700">{userDestiny.zodiac}</p></div>
                                            <div>
                                                <p className="text-gray-500 mb-2 text-lg">出生日柱</p>
                                                <div className="flex items-end gap-3">
                                                    <p className="text-5xl font-bold text-purple-800">{userDestiny.dayPillar}</p>

                                <section className="mb-12">
                                    <h3 className="text-2xl font-bold text-white bg-red-800 px-6 py-2 inline-block rounded-t-xl">02. 專屬內容索引</h3>
                                    <div className="border-2 border-gray-300 rounded-b-xl rounded-tr-xl overflow-hidden">
                                        <table className="w-full text-left border-collapse text-xl">
                                            <thead className="bg-gray-100 text-gray-700">
                                                <tr><th className="p-4 border-b border-gray-300">收錄主題</th><th className="p-4 border-b border-gray-300 w-40 text-center">原書頁碼</th></tr>
                                            </thead>
                                            <tbody>
                                                {pagesToPrint.map((item, idx) => {

                                                        </tr>
                                                    );

                                <section>

                                    <div className="border-2 border-gray-300 p-8 rounded-b-xl rounded-tr-xl text-gray-700 leading-relaxed space-y-5 text-lg">
                                        <p><strong>★ 關於日柱：</strong>除了大環境的生肖運勢，您的「日柱」代表個人（日元）及夫妻宮，能更精細地反映個人流年際遇與深層運勢變化，請優先詳讀後續剪報中的日柱篇章。</p>
                                        {userDestiny.fanTaiSui && (
                                            <p className="text-red-800 bg-red-50 p-5 rounded border border-red-200">
                                                <strong>⚠️ 犯太歲提醒：</strong>本年您屬於「{userDestiny.fanTaiSui.type}」。犯太歲代表變動與衝擊，不一定全為凶，但建議年初做好化解儀式，詳見後續附上的犯太歲化解錦囊。
                                            </p>
                                        )}
                                    </div>
                                </section>
                            </div>

                            <div className="w-full max-w-4xl mt-8">
                                <div className="mb-4 flex items-center justify-between">
                                    <h3 className="text-2xl font-bold text-gray-800">各章節第一頁預覽</h3>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {pagesToPrint.map((item, itemIndex) => {
                                        const firstPage = item.pages[0];
                                        const fullTitle = `${item.title} (共 ${item.pages.length} 頁)`;
                                        return <PdfPagePreview key={`preview-${itemIndex}`} title={fullTitle} pdfDoc={pdfDoc} pageNum={firstPage} pageOffset={pageOffset} scale={0.8} />;
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ label, subLabel, page, currentPage, offset, onClick, highlight = false, color = "red" }) => {
            const targetPageWithOffset = page + parseInt(offset || 0);
            const isSelected = targetPageWithOffset === currentPage;
            return (
                <li onClick={() => onClick(page)} className={`cursor-pointer p-3 rounded-md text-sm transition flex justify-between items-center group ${highlight ? 'bg-orange-100 text-orange-900 border border-orange-200 font-bold shadow-sm' : ''} ${isSelected ? 'bg-red-100 text-red-800 border-l-4 border-red-600 font-bold' : 'hover:bg-gray-100 text-gray-700 border-l-4 border-transparent'}`}>
                    <div>
                        <span className="block">{label}</span>
                        {subLabel && <span className="text-xs text-gray-400 font-normal">{subLabel}</span>}
                    </div>
                    <div className="flex items-center gap-1">
                        <span className={`text-[11px] px-1.5 py-0.5 rounded group-hover:bg-gray-300 ${isSelected ? 'bg-red-200 text-red-800' : 'bg-gray-200 text-gray-500'}`}>P.{page}</span>
                        {isSelected && <Icon name="eye" size={14} className="text-red-600" />}
                    </div>
                </li>
            );
        };

        const App = () => {
            const [scriptsLoaded, setScriptsLoaded] = useState(false);
            const [selectedYear, setSelectedYear] = useState('2027');
            const currentConfig = YEAR_CONFIGS[selectedYear];

            const [pdfDoc, setPdfDoc] = useState(null);
            const [rawPdfBytes, setRawPdfBytes] = useState(null);
            const [pageNum, setPageNum] = useState(1);
            const [pageCount, setPageCount] = useState(0);
            const [scale, setScale] = useState(1.2); 
            const [isRendering, setIsRendering] = useState(false);
            const [pageOffset, setPageOffset] = useState(7); 
            const [showReport, setShowReport] = useState(false);

            const [calendarType, setCalendarType] = useState('solar');
            const [inputData, setInputData] = useState({ name: '', year: '1990', month: '1', day: '1', hour: '12', gender: 'M' });
            const [lunarDate, setLunarDate] = useState({ year: 1990, month: 1, day: 1, isLeap: false });
            const [displayDateInfo, setDisplayDateInfo] = useState('');
            const [userDestiny, setUserDestiny] = useState(null);

            const canvasRef = useRef(null);
            const renderTaskRef = useRef(null);

            useEffect(() => {
                const loadScript = (src) => {
                    return new Promise((resolve, reject) => {
                        if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                        const script = document.createElement('script');
                        script.src = src; script.onload = resolve; script.onerror = reject;
                        document.head.appendChild(script);
                    });
                };
                Promise.all([
                    loadScript("https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js")
                ]).then(() => {
                    if (window.pdfjsLib) {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        setScriptsLoaded(true);
                        updateDisplayInfo(1990, 1, 1, 'solar');
                    }
                }).catch(err => { alert("資源載入失敗，請檢查網路連接"); });
            }, []);

            useEffect(() => { if (userDestiny) calculateDestiny(); }, [selectedYear]);

            const updateDisplayInfo = (y, m, d, type, isLeap = false) => {
                if (!window.Solar || !window.Lunar) return;
                if (type === 'solar') {
                    try {
                        const solar = window.Solar.fromYmd(parseInt(y), parseInt(m), parseInt(d));
                        const lunar = solar.getLunar();
                        setDisplayDateInfo(`農曆: ${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`);
                        setLunarDate({ year: lunar.getYear(), month: Math.abs(lunar.getMonth()), day: lunar.getDay(), isLeap: false });
                    } catch (e) { setDisplayDateInfo("無效日期"); }
                } else {
                    try {
                        const lunar = window.Lunar.fromYmd(parseInt(y), parseInt(m), parseInt(d));
                        const solar = lunar.getSolar();
                        setDisplayDateInfo(`西曆: ${solar.getYear()}年 ${solar.getMonth()}月 ${solar.getDay()}日`);
                        setInputData(prev => ({ ...prev, year: solar.getYear(), month: solar.getMonth(), day: solar.getDay() }));
                    } catch (e) { setDisplayDateInfo("無效日期"); }
                }
            };

            const handleSolarDateChange = (field, value) => {
                const newData = { ...inputData, [field]: value };
                setInputData(newData); updateDisplayInfo(newData.year, newData.month, newData.day, 'solar');
            };

            const handleLunarDateChange = (field, value) => {
                const newLunar = { ...lunarDate, [field]: value };
                setLunarDate(newLunar); updateDisplayInfo(newLunar.year, newLunar.month, newLunar.day, 'lunar', newLunar.isLeap);
            };

            // 核心修復：防止 ArrayBuffer 擁有權被 PDF.js 奪走
            const handleFileChange = async (e) => {
                if (!scriptsLoaded) return;
                const file = e.target.files[0];
                if (file && file.type === "application/pdf") {
                    const fileReader = new FileReader();
                    fileReader.onload = function() {
                        const arrayBuffer = this.result;
                        // 深拷貝一份給 pdf-lib，保護記憶體不被抽空
                        const rawBytes = new Uint8Array(arrayBuffer.slice(0));
                        setRawPdfBytes(rawBytes);
                        
                        // 另一份給 PDF.js 預覽使用
                        const pdfjsBytes = new Uint8Array(arrayBuffer);
                        loadPdf(pdfjsBytes);
                    };
                    fileReader.readAsArrayBuffer(file);
                } else { alert("請上傳有效的 PDF 文件"); }
            };

            const loadPdf = async (data) => {
                try {
                    const loadingTask = window.pdfjsLib.getDocument(data);
                    const pdf = await loadingTask.promise;
                    setPdfDoc(pdf); setPageCount(pdf.numPages); setPageNum(1); 
                } catch (error) { alert("PDF 載入失敗，請確保檔案未損壞。"); }
            };

            const renderPage = useCallback(async () => {
                if (!pdfDoc) return;
                if (renderTaskRef.current) renderTaskRef.current.cancel();
                setIsRendering(true);
                try {
                    const page = await pdfDoc.getPage(pageNum);
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const viewport = page.getViewport({ scale });
                    const context = canvas.getContext('2d', { willReadFrequently: true });
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    renderTaskRef.current = page.render({ canvasContext: context, viewport: viewport });
                    await renderTaskRef.current.promise;
                } catch (err) {} finally { renderTaskRef.current = null; setIsRendering(false); }
            }, [pdfDoc, pageNum, scale]);

            useEffect(() => { renderPage(); }, [renderPage]);

            const calculateDestiny = () => {
                if (!window.Solar) { alert("計算模組尚未載入完成，請稍候"); return; }
                const { year, month, day, hour } = inputData;
                const solar = window.Solar.fromYmdHms(parseInt(year), parseInt(month), parseInt(day), parseInt(hour), 0, 0);
                const lunar = solar.getLunar();
                
                let baziYear = lunar.getYearShengXiaoExact(); 
                if (ZODIAC_MAP[baziYear]) baziYear = ZODIAC_MAP[baziYear];

                const dayPillar = lunar.getDayInGanZhi(); 
                const yearGanZhi = lunar.getYearInGanZhi(); 
                const pillarIndex = JIA_ZI.indexOf(dayPillar);
                const config = YEAR_CONFIGS[selectedYear];
                const pillarPage = Math.floor(config.DAY_PILLAR_START_PAGE + (pillarIndex * PAGES_PER_PILLAR));

                setUserDestiny({
                    name: inputData.name || '使用者',
                    zodiac: baziYear,
                    dayPillar: dayPillar,
                    yearGanZhi: yearGanZhi,
                    fanTaiSui: config.FAN_TAI_SUI_RULES[baziYear] || null,
                    pillarIndex: pillarIndex,
                    pillarPage: pillarPage
                });
            };

            const handleExportICS = () => {
                if (!userDestiny || !window.LunarYear) return;
                const config = YEAR_CONFIGS[selectedYear];
                const zodiacInfo = config.ZODIAC_DATA[userDestiny.zodiac];
                
                let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Mak Fortune Reader//HK//\nCALSCALE:GREGORIAN\n";
                
                try {
                    const lunarYear = window.LunarYear.fromYear(parseInt(selectedYear));
                    const months = lunarYear.getMonths();
                    
                    months.forEach(m => {
                        const monthNum = m.getMonth();
                        const isLeap = monthNum < 0;
                        const absMonth = Math.abs(monthNum);
                        
                        const firstDayLunar = window.Lunar.fromYmd(parseInt(selectedYear), monthNum, 1);
                        const solar = firstDayLunar.getSolar();
                        
                        const startStr = `${solar.getYear()}${String(solar.getMonth()).padStart(2, '0')}${String(solar.getDay()).padStart(2, '0')}`;
                        const nextSolar = solar.next(1);
                        const endStr = `${nextSolar.getYear()}${String(nextSolar.getMonth()).padStart(2, '0')}${String(nextSolar.getDay()).padStart(2, '0')}`;
                        
                        const monthName = isLeap ? `閏${absMonth}月` : `${absMonth}月`;
                        const summary = `[麥玲玲運程] 肖${userDestiny.zodiac} ${monthName}運勢 & ${userDestiny.dayPillar}日柱`;
                        
                        const description = `這是一條自動生成的運程提醒。\\n\\n【肖${userDestiny.zodiac} ${monthName}運勢】\\n請查閱電子書 P.${zodiacInfo.monthly[0]} - P.${zodiacInfo.monthly[1]}\\n\\n【您的日柱：${userDestiny.dayPillar}】\\n請查閱電子書 P.${userDestiny.pillarPage} - P.${userDestiny.pillarPage+1}\\n\\n祝您${selectedYear}年順遂平安！`;
                        
                        icsContent += "BEGIN:VEVENT\n";
                        icsContent += `DTSTART;VALUE=DATE:${startStr}\n`;
                        icsContent += `DTEND;VALUE=DATE:${endStr}\n`;
                        icsContent += `SUMMARY:${summary}\n`;
                        icsContent += `DESCRIPTION:${description}\n`;
                        icsContent += "END:VEVENT\n";
                    });
                    
                    icsContent += "END:VCALENDAR";
                    
                    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${inputData.name || '專屬'}_${selectedYear}年每月運程日曆提醒.ics`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                } catch (err) {
                    alert("生成日曆時發生錯誤。");
                }
            };

            const goToPage = (targetPage) => {
                let finalPage = targetPage + parseInt(pageOffset || 0);
                if (finalPage < 1) finalPage = 1;
                if (pdfDoc && finalPage > pdfDoc.numPages) finalPage = pdfDoc.numPages;
                setPageNum(finalPage);
            };

            const changePage = (offset) => { goToPage(pageNum + offset - parseInt(pageOffset || 0)); };

            const renderSidebar = () => {
                if (!userDestiny) return <div className="p-4 text-gray-500 text-sm">請先輸入出生資料以生成專屬目錄。</div>;
                const zodiacInfo = currentConfig.ZODIAC_DATA[userDestiny.zodiac];
                if (!zodiacInfo) return <div className="p-4 bg-red-100 text-red-800 text-sm">錯誤：找不到生肖數據。</div>;

                return (
                    <div className="space-y-6 pb-20">
                        <div className="bg-white p-4 shadow-sm border-b sticky top-0 z-10 flex flex-col gap-3">
                            <button onClick={() => setShowReport(true)} className="w-full bg-red-700 hover:bg-red-800 text-white py-2.5 rounded shadow-sm flex items-center justify-center gap-2 transition font-bold text-sm">
                                <Icon name="layers" size={18} /> 📥 匯出專屬運程 PDF
                            </button>
                            <button onClick={handleExportICS} className="w-full bg-gray-800 hover:bg-gray-900 text-white py-2.5 rounded shadow-sm flex items-center justify-center gap-2 transition font-bold text-sm">
                                <Icon name="calendar" size={18} /> 📅 匯出運程至日曆 (Mac/iPhone)
                            </button>
                        </div>

                        <div className="bg-red-50 p-4 mx-2 rounded-lg border border-red-100 mt-4">
                            <h3 className="font-bold text-red-800 text-lg flex items-center gap-2"><Icon name="user" size={18} /> {userDestiny.name} 的命盤</h3>
                            <div className="mt-2 text-sm text-gray-700 space-y-1">
                                <p>生肖：<span className="font-bold text-lg">{userDestiny.zodiac}</span></p>
                                <p>日柱：<span className="font-bold text-lg text-purple-800">{userDestiny.dayPillar}</span></p>
                            </div>
                        </div>

                        {userDestiny.fanTaiSui && (
                            <div className="bg-red-600 text-white p-4 mx-2 rounded-lg shadow-md cursor-pointer hover:bg-red-700 transition" onClick={() => goToPage(userDestiny.fanTaiSui.page)}>
                                <h3 className="font-bold flex items-center gap-2 mb-1"><Icon name="alert-triangle" size={18} /> {selectedYear} 犯太歲：{userDestiny.fanTaiSui.type}</h3>
                                <div className="mt-2 text-xs bg-white/20 inline-block px-2 py-1 rounded font-bold">點擊查看化解錦囊 (P.{userDestiny.fanTaiSui.page})</div>
                            </div>
                        )}

                        <div className="px-2">
                            <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-red-500"><Icon name="user" size={18} /> 專屬開運攻略</h3>
                            <ul className="space-y-2">
                                <SidebarItem label={`開運攻略 - 肖${userDestiny.zodiac}`} page={zodiacInfo.strategy} offset={pageOffset} onClick={goToPage} />
                                {userDestiny.fanTaiSui && (
                                    <SidebarItem label="⚠️ 犯太歲化解錦囊" subLabel={`(P.23 - P.30)`} page={23} offset={pageOffset} onClick={goToPage} highlight={true} />
                                )}
                            </ul>
                        </div>

                        <div className="px-2">
                            <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-orange-500"><Icon name="book-open" size={18} /> 生肖運程 (肖{userDestiny.zodiac})</h3>
                            <ul className="space-y-2">
                                <SidebarItem label="整體運勢 (含財運/事業等)" subLabel={`(P.${zodiacInfo.general[0]} - ${zodiacInfo.general[1]})`} page={zodiacInfo.general[0]} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="各年份出生運程" subLabel={`(P.${zodiacInfo.years[0]} - ${zodiacInfo.years[1]})`} page={zodiacInfo.years[0]} offset={pageOffset} onClick={goToPage} />
                                <SidebarItem label="每月運程" subLabel={`(P.${zodiacInfo.monthly[0]} - ${zodiacInfo.monthly[1]})`} page={zodiacInfo.monthly[0]} offset={pageOffset} onClick={goToPage} />
                            </ul>
                        </div>

                        <div className="px-2">
                            <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-purple-500"><Icon name="star" size={18} /> 出生日柱運勢</h3>
                            <ul className="space-y-2">
                                <SidebarItem label={`您的日柱：${userDestiny.dayPillar}`} subLabel={`精確定位：P.${userDestiny.pillarPage} - ${userDestiny.pillarPage + 1}`} page={userDestiny.pillarPage} offset={pageOffset} onClick={goToPage} color="purple" highlight={true}/>
                            </ul>
                        </div>

                        {selectedYear === '2027' && (
                            <div className="px-2">
                                <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-blue-500"><Icon name="globe" size={18} /> 世界大勢</h3>
                                <ul className="space-y-2">
                                    <SidebarItem label="羊年世界大勢總論" subLabel="(P.1 - P.13)" page={1} offset={pageOffset} onClick={goToPage} />
                                </ul>
                            </div>
                        )}

                        {selectedYear === '2027' && (
                            <div className="px-2">
                                <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-yellow-500"><Icon name="compass" size={18} /> 行運風水佈局</h3>
                                <ul className="space-y-2">
                                    <SidebarItem label="羊年九大吉凶方位" page={379} offset={pageOffset} onClick={goToPage} />
                                    <SidebarItem label="家居全方位風水陣" page={390} offset={pageOffset} onClick={goToPage} />
                                    <SidebarItem label="過年習俗知識" page={395} offset={pageOffset} onClick={goToPage} />
                                    <SidebarItem label="簡易與辦公室風水陣" page={400} offset={pageOffset} onClick={goToPage} />
                                </ul>
                            </div>
                        )}

                        {selectedYear === '2027' && (
                            <div className="px-2">
                                <h3 className="text-gray-900 font-bold mb-3 px-2 flex items-center gap-2 border-l-4 border-green-500"><Icon name="calendar" size={18} /> 吉時吉日與通勝</h3>
                                <ul className="space-y-2">
                                    <SidebarItem label="羊年吉時吉日" page={413} offset={pageOffset} onClick={goToPage} />
                                    <SidebarItem label="每日通勝" subLabel="(P.425 - P.449)" page={425} offset={pageOffset} onClick={goToPage} />
                                </ul>
                            </div>
                        )}
                    </div>
                );
            };

            if (!scriptsLoaded) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-gray-50 text-gray-600">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-red-700 mb-4"></div>
                        <p>正在初始化系統資源 (PDF/Lunar)...</p>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen overflow-hidden font-sans text-gray-800 bg-[#fdfbf7] app-container">
                    
                    {showReport && (
                        <ReportModal 
                            userDestiny={userDestiny} inputData={inputData} pdfDoc={pdfDoc} rawPdfBytes={rawPdfBytes}
                            pageOffset={pageOffset} currentConfig={currentConfig} selectedYear={selectedYear}
                            onClose={() => setShowReport(false)} 
                        />
                    )}

                    <header className="bg-red-900 text-white h-14 flex items-center px-4 md:px-6 justify-between shadow-lg z-10 shrink-0">
                        <div className="flex items-center gap-2 font-bold text-lg overflow-hidden whitespace-nowrap">
                            <Icon name="file-text" />
                            <span className="hidden md:inline">{currentConfig.yearTitle}麥玲玲運程書 - </span>智能閱讀器
                        </div>
                        
                        <div className="flex items-center gap-2">
                            {pdfDoc && (
                                <>
                                    <div className="flex items-center bg-red-950 rounded px-2 py-1 gap-2">
                                        <button onClick={() => changePage(-1)} disabled={pageNum <= 1} className="hover:text-red-300 disabled:opacity-30"><Icon name="chevron-left" size={20}/></button>
                                        <span className="text-sm font-mono w-16 text-center">{pageNum} / {pageCount}</span>
                                        <button onClick={() => changePage(1)} disabled={pageNum >= pageCount} className="hover:text-red-300 disabled:opacity-30"><Icon name="chevron-right" size={20}/></button>
                                    </div>
                                    <div className="flex items-center bg-red-950 rounded px-2 py-1 gap-2 hidden md:flex">
                                        <button onClick={() => setScale(s => Math.max(0.5, s - 0.2))} className="hover:text-red-300"><Icon name="minus" size={16}/></button>
                                        <span className="text-xs">{Math.round(scale * 100)}%</span>
                                        <button onClick={() => setScale(s => Math.min(3.0, s + 0.2))} className="hover:text-red-300"><Icon name="plus" size={16}/></button>
                                    </div>
                                </>
                            )}
                            <div className="text-xs md:text-sm bg-red-950 px-3 py-1 rounded flex items-center gap-2 ml-2">
                                <span className="hidden md:inline text-gray-300">首頁校正:</span>
                                <input type="number" value={pageOffset} onChange={(e) => setPageOffset(e.target.value)} className="w-12 text-black px-1 rounded text-center" />
                            </div>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        <div className="w-80 bg-white border-r border-gray-200 flex flex-col h-full shadow-xl z-10 shrink-0">
                            
                            <div className="p-3 bg-red-50 border-b border-red-200 flex gap-2 justify-center shrink-0">
                                <button className={`px-4 py-1.5 rounded-full text-sm font-bold transition ${selectedYear === '2026' ? 'bg-red-800 text-white shadow-md' : 'bg-white text-red-800 border border-red-300 hover:bg-red-100'}`} onClick={() => setSelectedYear('2026')}>2026 馬年</button>
                                <button className={`px-4 py-1.5 rounded-full text-sm font-bold transition ${selectedYear === '2027' ? 'bg-red-800 text-white shadow-md' : 'bg-white text-red-800 border border-red-300 hover:bg-red-100'}`} onClick={() => setSelectedYear('2027')}>2027 羊年</button>
                            </div>

                            <div className="p-4 border-b border-gray-200 bg-white shrink-0 shadow-sm">
                                <div className="space-y-3">
                                    <div className="flex gap-2">
                                        <input type="text" placeholder="姓名" className="flex-1 p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-red-500 bg-gray-50" value={inputData.name} onChange={(e) => setInputData({...inputData, name: e.target.value})} />
                                        <select className="w-20 p-2 border border-gray-300 rounded text-sm bg-gray-50" value={inputData.gender} onChange={(e) => setInputData({...inputData, gender: e.target.value})}>
                                            <option value="M">男</option>
                                            <option value="F">女</option>
                                        </select>
                                    </div>

                                    <div className="flex border border-gray-300 rounded overflow-hidden">
                                        <button className={`flex-1 py-1.5 text-xs font-bold transition ${calendarType === 'solar' ? 'bg-gray-700 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`} onClick={() => setCalendarType('solar')}>
                                            <div className="flex items-center justify-center gap-1"><Icon name="sun" size={12}/> 公曆(西曆)</div>
                                        </button>
                                        <button className={`flex-1 py-1.5 text-xs font-bold transition ${calendarType === 'lunar' ? 'bg-gray-700 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`} onClick={() => setCalendarType('lunar')}>
                                            <div className="flex items-center justify-center gap-1"><Icon name="moon" size={12}/> 農曆</div>
                                        </button>
                                    </div>

                                    {calendarType === 'solar' ? (
                                        <div className="flex gap-1">
                                            <input type="number" placeholder="年" className="w-1/3 p-2 border rounded text-sm bg-gray-50 text-center" value={inputData.year} onChange={(e) => handleSolarDateChange('year', e.target.value)} />
                                            <input type="number" placeholder="月" className="w-1/3 p-2 border rounded text-sm bg-gray-50 text-center" value={inputData.month} onChange={(e) => handleSolarDateChange('month', e.target.value)} />
                                            <input type="number" placeholder="日" className="w-1/3 p-2 border rounded text-sm bg-gray-50 text-center" value={inputData.day} onChange={(e) => handleSolarDateChange('day', e.target.value)} />
                                        </div>
                                    ) : (
                                        <div className="flex gap-1">
                                            <input type="number" placeholder="農曆年" className="w-1/3 p-2 border rounded text-sm bg-gray-50 text-center" value={lunarDate.year} onChange={(e) => handleLunarDateChange('year', e.target.value)} />
                                            <input type="number" placeholder="農曆月" className="w-1/3 p-2 border rounded text-sm bg-gray-50 text-center" value={lunarDate.month} onChange={(e) => handleLunarDateChange('month', e.target.value)} />
                                            <input type="number" placeholder="農曆日" className="w-1/3 p-2 border rounded text-sm bg-gray-50 text-center" value={lunarDate.day} onChange={(e) => handleLunarDateChange('day', e.target.value)} />
                                        </div>
                                    )}

                                    <div className={`text-xs text-center p-1.5 rounded font-bold bg-gray-100 text-gray-600`}>
                                        {displayDateInfo}
                                    </div>

                                    <button onClick={calculateDestiny} className="w-full bg-red-800 hover:bg-red-900 text-white py-2.5 rounded shadow-sm text-sm font-bold transition flex justify-center items-center gap-2">
                                        <Icon name="search" size={16} /> 生成個人命盤與目錄
                                    </button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto bg-gray-50 scrollbar-hide">
                                {renderSidebar()}
                            </div>

                            <div className="p-4 border-t border-gray-200 bg-white shrink-0 text-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                                <label className="cursor-pointer block">
                                    <span className="bg-gray-100 hover:bg-gray-200 text-gray-800 py-2.5 px-4 rounded text-sm block w-full transition font-bold border border-gray-300">
                                        {pdfDoc ? "更換 PDF 檔案" : "📁 點擊上傳 PDF 電子書"}
                                    </span>
                                    <input type="file" className="hidden" accept=".pdf" onChange={handleFileChange} />
                                </label>
                                <p className="text-[10px] text-gray-500 mt-2 font-medium">請上傳「{currentConfig.pdfName}」</p>
                            </div>
                        </div>

                        <div className="flex-1 bg-[#525659] h-full relative overflow-auto flex justify-center p-4 md:p-8">
                            {pdfDoc ? (
                                <div className="relative">
                                    <canvas ref={canvasRef} className="shadow-2xl bg-white max-w-full" />
                                    {isRendering && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-white/50 z-10">
                                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-red-700"></div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-gray-300 space-y-4">
                                    <Icon name="book-open" size={80} className="opacity-40" />
                                    <div className="text-center">
                                        <p className="text-xl font-bold mb-2">請上傳該年份的運程書 PDF</p>
                                        <p className="text-sm opacity-70">當前選擇：{currentConfig.yearTitle}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
