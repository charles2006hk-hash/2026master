        const getPillars = (year, month, day, hour) => {
            const HEAVENLY_STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
            const EARTHLY_BRANCHES = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
            
            const date = new Date(year, month - 1, day);
            const anchorDate = new Date(1900, 0, 31); // 甲辰日
            const offset = Math.floor((date - anchorDate) / 86400000);
            const dayIndex = (40 + offset) % 60;
            
            const dayStem = HEAVENLY_STEMS[dayIndex % 10];
            const dayBranch = EARTHLY_BRANCHES[dayIndex % 12];
            const zodiacIndex = (year - 4) % 12;
            
            return {
                zodiac: ZODIACS[zodiacIndex < 0 ? zodiacIndex + 12 : zodiacIndex],

                    <div className="bg-white shadow-sm flex overflow-x-auto whitespace-nowrap">
                        {[
                            {id: 'zodiac', label: '生肖運程', icon: 'fa-dragon'},
                            {id: 'pillar', label: '日柱詳批', icon: 'fa-scroll'},
                            {id: 'taisui', label: '化解犯太歲', icon: 'fa-shield-alt', alert: isFanTaiSui},
                            {id: 'calendar', label: '每日通勝', icon: 'fa-calendar-alt'},
                            {id: 'fengshui', label: '風水佈局', icon: 'fa-compass'}
                        ].map(t => (
                            <button 
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`flex-1 py-3 px-4 text-center border-b-2 transition-colors flex items-center justify-center gap-2 ${tab === t.id ? 'border-red-600 text-red-800 bg-red-50' : 'border-transparent text-gray-500'}`}
                            >
                                <i className={`fas ${t.icon} ${t.alert ? 'text-red-500 animate-pulse' : ''}`}></i>

                    <div className="p-4 max-w-4xl mx-auto">
                        
                        {tab === 'zodiac' && (
                            <div className="space-y-4 fade-in">

                                        <ul className="list-disc pl-4 text-sm text-green-700">

                                    </div>
                                    <div className="bg-gray-100 p-4 rounded-xl shadow-sm">

                                        <ul className="list-disc pl-4 text-sm text-gray-600">

                                   <div className="space-y-3">

                        {tab === 'pillar' && (

                                            {GOOD_DAYS['嫁娶'].map((day, idx) => (
                                                <span key={idx} className="bg-pink-50 text-pink-700 px-3 py-1 rounded-full text-sm font-medium border border-pink-200 flex flex-col items-center">

                                                    <span className="text-xs opacity-75">{day.lunar}</span>

                                    </div>

                                        <div className="bg-red-600 text-white px-4 py-2 font-bold flex justify-between items-center">
                                            <span className="flex items-center"><i className="fas fa-briefcase mr-2"></i>開市吉日</span>
                                        </div>
                                        <div className="p-4 flex flex-wrap gap-2">
                                            {GOOD_DAYS['開市'].map((day, idx) => (
                                                <span key={idx} className="bg-red-50 text-red-700 px-3 py-1 rounded-full text-sm font-medium border border-red-200 flex flex-col items-center">
                                                    <span>{day.date}</span>
                                                    <span className="text-xs opacity-75">{day.lunar}</span>
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'fengshui' && (
                            <div className="space-y-6 fade-in">
                                <div className="grid grid-cols-3 gap-1 bg-white rounded-xl shadow p-2">
                                    {/* 九宮格佈局 */}
                                    {['東南', '南', '西南', '東', '中宮', '西', '東北', '北', '西北'].map((dir, idx) => {
                                        const sector = FENG_SHUI.find(s => s.pos === (dir.includes('中') ? '中宮' : (dir.includes('南') && dir.length===1 ? '正南' : (dir.includes('北') && dir.length===1 ? '正北' : (dir.includes('東') && dir.length===1 ? '正東' : (dir.includes('西') && dir.length===1 ? '正西' : dir))))));
                                        return (
                                            <div key={idx} className={`aspect-square ${sector.color} flex flex-col items-center justify-center text-center p-1 border border-white relative group`}>
                                                <span className="text-[10px] absolute top-1 left-1 opacity-50">{dir}</span>
                                                <div className="mb-1"><i className={`fas ${sector.icon} opacity-60`}></i></div>
                                                <span className="font-bold text-sm leading-tight">{sector.star.split(' ')[0]}</span>
                                                <span className="text-[10px] opacity-75">{sector.star.split(' ')[1]?.replace('(', '').replace(')', '')}</span>
                                            </div>
                                        )
                                    })}
                                </div>
                                
                                <div className="bg-white rounded-xl shadow p-4">
                                    <h4 className="font-bold text-gray-800 mb-2">重點佈局建議：</h4>
                                    <ul className="space-y-2 text-sm text-gray-600">
                                        <li className="flex items-start"><i className="fas fa-map-marker-alt text-red-500 mt-1 mr-2"></i><span><strong>催財運 (東南)：</strong>九紫當旺，宜放紅色地氈或長明燈。</span></li>
                                        <li className="flex items-start"><i className="fas fa-map-marker-alt text-pink-500 mt-1 mr-2"></i><span><strong>催桃花 (中宮)：</strong>一白入中，宜放水種植物或粉晶。</span></li>
                                        <li className="flex items-start"><i className="fas fa-map-marker-alt text-gray-500 mt-1 mr-2"></i><span><strong>化災煞 (正南)：</strong>五黃大煞，忌動土，宜掛銅鈴化解。</span></li>
                                        <li className="flex items-start"><i className="fas fa-map-marker-alt text-green-500 mt-1 mr-2"></i><span><strong>旺學業 (東北)：</strong>四綠文昌，宜放四支富貴竹。</span></li>
                                    </ul>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const App = () => {
            const [master, setMaster] = useState(null);
            const [userData, setUserData] = useState(null);

            if (!master) {
                return <MasterSelection onSelect={setMaster} />;
            }

            if (!userData) {
                return <UserInput onCalculate={setUserData} onBack={() => setMaster(null)} />;
            }

            return <ResultDashboard data={userData} onBack={() => setUserData(null)} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
